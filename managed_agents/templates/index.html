<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Datos económicos AR · Agente</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #ffffff;
      --ink: #1f2421;
      --muted: #6b7770;
      --line: #e3ddd0;
      --accent: #1f6f5c;
      --accent-soft: #e7f0ec;
      --user: #1f6f5c;
      --error: #b4452f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 650; }
    header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    header .spacer { flex: 1; }
    header a, header button {
      font-size: 12px;
      color: var(--accent);
      background: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      text-decoration: none;
    }
    header button:hover, header a:hover { background: var(--accent-soft); }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
    }
    .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .msg { display: flex; }
    .msg.user { justify-content: flex-end; }
    .bubble {
      max-width: 80%;
      padding: 11px 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 14.5px;
    }
    .msg.user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .chip {
      font-size: 11.5px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 3px 9px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .chip::before { content: "⚙ "; }
    .bubble.error { border-color: var(--error); color: var(--error); background: #fbeae6; }
    .empty { color: var(--muted); text-align: center; margin-top: 40px; font-size: 14px; }
    .cursor { display: inline-block; width: 7px; height: 1.05em; background: var(--muted); vertical-align: text-bottom; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    footer {
      padding: 12px 16px;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }
    .inputbar { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 13px;
      font: inherit;
      font-size: 14.5px;
      max-height: 140px;
      background: #fff;
      color: var(--ink);
    }
    textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    #send {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      font-weight: 600;
      cursor: pointer;
    }
    #send:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Datos económicos de Argentina</h1>
      <div class="sub">Agente que responde solo con datos del MCP · streaming en vivo</div>
    </div>
    <div class="spacer"></div>
    <a id="console" href="#" target="_blank" style="display:none">Ver sesión ↗</a>
    <button id="reset">Nueva conversación</button>
  </header>

  <div id="chat"><div class="wrap" id="wrap">
    <div class="empty" id="empty">Preguntá algo, por ejemplo: «¿a cuánto está el dólar?»</div>
  </div></div>

  <footer>
    <div class="inputbar">
      <textarea id="q" rows="1" placeholder="Escribí tu pregunta…" autofocus></textarea>
      <button id="send">Enviar</button>
    </div>
  </footer>

  <script>
    const wrap = document.getElementById("wrap");
    const empty = document.getElementById("empty");
    const input = document.getElementById("q");
    const sendBtn = document.getElementById("send");
    const resetBtn = document.getElementById("reset");
    const consoleLink = document.getElementById("console");
    let sessionId = null;
    let busy = false;

    async function newSession() {
      const r = await fetch("/api/session", { method: "POST" });
      const data = await r.json();
      sessionId = data.session_id;
      consoleLink.href = data.console_url;
      consoleLink.style.display = "inline-block";
    }

    function addBubble(role) {
      if (empty) empty.remove();
      const msg = document.createElement("div");
      msg.className = "msg " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      msg.appendChild(bubble);
      wrap.appendChild(msg);
      scrollDown();
      return bubble;
    }

    function scrollDown() {
      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    }
    input.addEventListener("input", autosize);

    async function send() {
      const message = input.value.trim();
      if (!message || busy || !sessionId) return;
      busy = true;
      sendBtn.disabled = true;

      addBubble("user").textContent = message;
      input.value = "";
      autosize();

      // Burbuja del agente: panel de tools + texto con cursor.
      const bubble = addBubble("bot");
      const tools = document.createElement("div");
      tools.className = "tools";
      const textEl = document.createElement("span");
      const cursor = document.createElement("span");
      cursor.className = "cursor";
      bubble.appendChild(tools);
      bubble.appendChild(textEl);
      bubble.appendChild(cursor);

      try {
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message }),
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const frames = buf.split("\n\n");
          buf = frames.pop(); // resto parcial
          for (const frame of frames) {
            const line = frame.replace(/^data: ?/, "").trim();
            if (!line) continue;
            const ev = JSON.parse(line);
            if (ev.type === "text") {
              textEl.textContent += ev.text;
            } else if (ev.type === "tool") {
              const chip = document.createElement("span");
              chip.className = "chip";
              chip.textContent = ev.name;
              tools.appendChild(chip);
            } else if (ev.type === "error") {
              bubble.classList.add("error");
              textEl.textContent += (textEl.textContent ? "\n\n" : "") + "Error: " + ev.message;
            }
            scrollDown();
          }
        }
      } catch (e) {
        bubble.classList.add("error");
        textEl.textContent += "\n\nError de red: " + e;
      } finally {
        cursor.remove();
        if (!tools.childElementCount) tools.remove();
        busy = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    resetBtn.addEventListener("click", async () => {
      if (busy) return;
      wrap.innerHTML = "";
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "Nueva conversación. Preguntá algo cuando quieras.";
      wrap.appendChild(e);
      await newSession();
    });

    newSession();
  </script>
</body>
</html>
